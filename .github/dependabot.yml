version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router']
      drizzle:
        patterns: ['drizzle-*']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      vite-and-test:
        patterns: ['vite', '@vitejs/*', 'vitest', '@tailwindcss/*', 'tailwindcss']
    ignore:
      # typescript-eslint supports TypeScript < 6.1; bump together deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
